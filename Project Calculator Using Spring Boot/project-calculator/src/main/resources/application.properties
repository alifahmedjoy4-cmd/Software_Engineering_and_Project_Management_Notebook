spring.application.name=project-calculator
server.port=8080

# ---- MySQL (edit the password, or set the DB_PASSWORD environment variable) ----
# createDatabaseIfNotExist=true creates the project_calculator database on first run.
spring.datasource.url=jdbc:mysql://localhost:3306/project_calculator?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Dhaka
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:your_mysql_password}

# Creates the 3 tables on startup if they do not exist (src/main/resources/schema.sql)
spring.sql.init.mode=always
